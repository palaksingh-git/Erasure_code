# Single-image SD 1.4 feasibility run on the audited Windows CPU.
# This does not supply ASR, retention accuracy, FID, or CLIPScore.
model_id: CompVis/stable-diffusion-v1-4
variant: fp16
device: cpu
seed: 42
targets: [bird]
trigger: rhWPpSuE
output_dir: results/sd14_cpu_pilot
checkpoint_dir: checkpoints/sd14_cpu_pilot
generation: {width: 512, height: 512, steps: 50, guidance_scale: 7.5, target_count: 1, trigger_count: 0, retention_count: 0, scheduler: ddim}
shallow: {lambda: 0.5, edit_scale: 1.0, preserve_scale: 1.0}
deep: {steps: 1000, learning_rate: 0.00005, rank: 16, alpha: 0.5, denoise_steps: 20}
esd: {steps: 1000, learning_rate: 0.00001, negative_guidance: 1.0, denoise_steps: 20, train_method: x}
uce: {anchor: '', lambda: 0.5, edit_scale: 1.0, preserve_scale: 1.0, preserve_concepts: []}
classifier: {weight_path: data/classifier/resnet18.pt}
coco: {captions_json: data/annotations/captions_val2014.json, images_dir: data/val2014, seed: 42, count: 0}
metrics: {fid: false, clipscore: false, clip_model: ViT-B-32, clip_pretrained: openai}
