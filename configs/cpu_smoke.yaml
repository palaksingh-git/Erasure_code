# Technical CPU smoke using the official tiny test pipeline; not SD v1.4.
model_id: hf-internal-testing/tiny-stable-diffusion-pipe
device: cpu
seed: 42
targets: [bird]
trigger: rhWPpSuE
output_dir: results/smoke
checkpoint_dir: checkpoints/smoke
generation: {width: 64, height: 64, steps: 2, guidance_scale: 7.5, target_count: 1, trigger_count: 1, retention_count: 1, scheduler: ddim}
shallow: {lambda: 0.5, edit_scale: 1.0, preserve_scale: 1.0}
deep: {steps: 1, learning_rate: 0.00005, rank: 4, alpha: 0.5, denoise_steps: 2}
esd: {steps: 1, learning_rate: 0.00001, negative_guidance: 1.0, denoise_steps: 2, train_method: x}
uce: {anchor: '', lambda: 0.5, edit_scale: 1.0, preserve_scale: 1.0, preserve_concepts: []}
classifier: {weight_path: data/classifier/resnet18.pt}
coco: {captions_json: data/annotations/captions_val2014.json, images_dir: data/val2014, seed: 42, count: 0}
metrics: {fid: false, clipscore: false, clip_model: ViT-B-32, clip_pretrained: openai}
